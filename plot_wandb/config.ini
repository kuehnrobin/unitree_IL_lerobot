# Configuration file for wandb plotting system
# This file contains default settings that can be customized

[plotting]
# Default plot configuration type: thesis, paper, presentation
default_config = thesis

# Default output directory
output_dir = plots

# Default metrics to plot if none specified
default_metrics = [
    "train/loss",
    "val/loss", 
    "train/accuracy",
    "val/accuracy",
    "train/learning_rate"
]

# Enable smoothing by default
enable_smoothing = true
smoothing_window = 10

[export]
# Default export formats
formats = ["png", "svg", "pdf"]

# Export DPI for raster formats
dpi = 300

# LaTeX settings
use_latex = false
latex_preamble = [
    "\\usepackage{amsmath}",
    "\\usepackage{amssymb}"
]

[server]
# Default port for wandb server
default_port = 8080

# Auto-open browser when starting server
open_browser = true

[thesis]
# Thesis-specific settings
figure_width = "0.8\\textwidth"
figure_placement = "htbp"

# Color scheme for thesis (academic-friendly colors)
colors = [
    "#1f77b4",  # Blue
    "#ff7f0e",  # Orange  
    "#2ca02c",  # Green
    "#d62728",  # Red
    "#9467bd",  # Purple
    "#8c564b",  # Brown
    "#e377c2",  # Pink
    "#7f7f7f",  # Gray
    "#bcbd22",  # Olive
    "#17becf"   # Cyan
]

[style]
# Font settings
font_family = serif
font_size = 12
title_size = 14
label_size = 12
tick_size = 10
legend_size = 10

# Grid and visual settings
grid = true
grid_alpha = 0.3
spine_width = 1.0
